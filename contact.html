<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Tablenote</title>
<meta name="description" content="Contact the Tablenote team about questions, bugs or refunds.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/brand.css">
<style>
  .doc { max-width: 720px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 40px 72px; display: grid; gap: 14px; }
  .doc h1 { font-size: clamp(32px, 6vw, 44px); font-weight: 800; }
  .doc h2 { font-size: 22px; font-weight: 700; margin-top: 18px; }
  .doc p, .doc li { color: var(--ink); max-width: 65ch; }
  .doc ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
</style>
</head>
<body>
<main class="doc">
  <a class="wordmark" href="./">← Tablenote</a>
  <h1>Contact</h1>
  <p>Questions, bugs, refunds or a feature you need. A person reads every message. Please don't include client information.</p>
  <form id="contact" action="https://formsubmit.co/ajax/a31453b1dc8c84718be297694be344b1" method="POST" style="display:grid;gap:14px;max-width:520px;margin-top:20px">
    <input type="hidden" name="_subject" value="Tablenote support message">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <label style="display:grid;gap:6px">Your email
      <input type="email" name="email" autocomplete="email" required style="font:inherit;padding:10px 12px;border:1px solid var(--line,#ccd);border-radius:8px;background:transparent;color:inherit">
    </label>
    <label style="display:grid;gap:6px">Message
      <textarea name="message" rows="6" required style="font:inherit;padding:10px 12px;border:1px solid var(--line,#ccd);border-radius:8px;background:transparent;color:inherit"></textarea>
    </label>
    <button class="btn" type="submit" id="contact-send" style="justify-self:start">Send message</button>
    <p id="contact-status" role="status" style="margin:0"></p>
  </form>
  <script>
  document.getElementById('contact').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, status = document.getElementById('contact-status'), send = document.getElementById('contact-send');
    send.disabled = true; status.textContent = 'Sending…';
    fetch(f.action, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(f) })
      .then(function (r) { if (!r.ok) throw new Error(); f.reset(); status.textContent = "Thanks. We'll reply by email."; })
      .catch(function () { status.textContent = "That didn't send. Please try again in a moment."; })
      .finally(function () { send.disabled = false; });
  });
  </script>
</main>
</body>
</html>
